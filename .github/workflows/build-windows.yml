# Builds and tests the Windows Collector on a real Windows machine.
# - every push and pull request: tests + installer as a downloadable build artifact
# - a tag like v0.2.0, or "Run workflow" with a version: also publishes the installer
#   on the GitHub Releases page (creating the tag on the built commit)
name: Windows build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "公開する版（例: v0.2.0）。空なら公開しない"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows,dev]" pyinstaller

      - name: Tests (on Windows)
        run: python -m pytest -q

      - name: Windows modules import on real Windows
        run: python -c "import flowlens.windows.app, flowlens.windows.shell, flowlens.windows.input_watcher, flowlens.windows.past_import"

      - name: Build flowlens.exe
        run: pyinstaller installer/flowlens.spec --distpath dist --workpath build --noconfirm

      - name: Packaged app starts (self-check)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\flowlens\flowlens.exe -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check failed: $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\flowlens.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: flowlens-installer
          path: dist/installer/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$env:VERSION" dist/installer/flowlens_installer.exe `
            --target "${{ github.sha }}" --prerelease `
            --title "FlowLens $env:VERSION（実機確認前）" `
            --notes "社員の PC に入れるインストーラーです。Windows の実機ではまだ確認が済んでいません（docs/manual-checks.md）。初回は Windows の警告が出ます:「詳細情報」→「実行」。"
